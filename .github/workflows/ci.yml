name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
          experimental: true

      - name: Install dependencies
        run: mise run install

      - name: Run tests
        run: mise run test

  cross-compile:
    name: Cross-Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
          experimental: true

      - name: Install dependencies
        run: mise run install

      - name: Cross-compile all platforms
        run: mise run cross-build

      - name: Verify binaries
        run: |
          echo "Verifying cross-compiled binaries..."
          ls -la bin/
          file bin/icloud-linux-amd64
          file bin/icloud-linux-arm64
          file bin/icloud-darwin-amd64
          file bin/icloud-darwin-arm64
          file bin/icloud-windows-amd64.exe
