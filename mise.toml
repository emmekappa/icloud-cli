[tools]
# Core language and runtime tools
go = "1.25.1"

# Development and build tools
golangci-lint = "latest"
gh = "latest"                                           # GitHub CLI for releases
"go:github.com/isaacphi/mcp-language-server" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"
"go:mvdan.cc/gofumpt" = "latest"                        # Stricter Go formatter

[settings]
experimental = true

[env]
# Version-related environment variables
VERSION = "{{exec(command='cat VERSION.txt')}}"
GIT_COMMIT = "{{exec(command='git rev-parse --short HEAD 2>/dev/null || echo unknown')}}"
BUILD_TIME = "{{exec(command='date -u \"+%a %b %d %I:%M:%S %p UTC %Y\"')}}"

# Version package path for ldflags
VERSION_PKG = "github.com/jingkaihe/icloud-cli/version"

[tasks.build]
description = "Build the CLI application (native; CGO on by default so Reminders work on macOS)"
run = [
  "mkdir -p bin",
  "echo 'Building icloud CLI binary...'",
  "go build -ldflags=\"-X '$VERSION_PKG.Version=$VERSION' -X '$VERSION_PKG.GitCommit=$GIT_COMMIT' -X '$VERSION_PKG.BuildTime=$BUILD_TIME'\" -o ./bin/icloud ./",
]

[tasks.test]
description = "Run Go tests"
run = ["go test ./..."]

[tasks.format]
description = "Format Go code with gofumpt"
run = ["gofumpt -w ."]

[tasks.lint]
description = "Run all linters (go vet, golangci-lint, staticcheck)"
run = ["go vet ./...", "echo 'Running golangci-lint...'", "golangci-lint run", "echo 'Running staticcheck...'", "staticcheck -checks=all ./..."]

[tasks.build-release-nondarwin]
description = "Build release binaries for linux + windows (CGO off; any runner)"
run = [
  "mkdir -p bin",
  "CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags=\"-X '$VERSION_PKG.Version=$VERSION' -X '$VERSION_PKG.GitCommit=$GIT_COMMIT' -X '$VERSION_PKG.BuildTime=$BUILD_TIME'\" -o ./bin/icloud-linux-amd64 ./",
  "CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags=\"-X '$VERSION_PKG.Version=$VERSION' -X '$VERSION_PKG.GitCommit=$GIT_COMMIT' -X '$VERSION_PKG.BuildTime=$BUILD_TIME'\" -o ./bin/icloud-linux-arm64 ./",
  "CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags=\"-X '$VERSION_PKG.Version=$VERSION' -X '$VERSION_PKG.GitCommit=$GIT_COMMIT' -X '$VERSION_PKG.BuildTime=$BUILD_TIME'\" -o ./bin/icloud-windows-amd64.exe ./",
]

[tasks.build-release-darwin]
description = "Build darwin release binaries (CGO on; macOS runner required for EventKit linking)"
run = [
  "mkdir -p bin",
  "CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags=\"-X '$VERSION_PKG.Version=$VERSION' -X '$VERSION_PKG.GitCommit=$GIT_COMMIT' -X '$VERSION_PKG.BuildTime=$BUILD_TIME'\" -o ./bin/icloud-darwin-amd64 ./",
  "CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags=\"-X '$VERSION_PKG.Version=$VERSION' -X '$VERSION_PKG.GitCommit=$GIT_COMMIT' -X '$VERSION_PKG.BuildTime=$BUILD_TIME'\" -o ./bin/icloud-darwin-arm64 ./",
]

[tasks.cross-build]
description = "Build all release binaries locally (requires a mac: darwin needs CGO)"
depends = ["build-release-nondarwin", "build-release-darwin"]

[tasks.install]
description = "Install Go module dependencies"
run = [
  "echo 'Installing Go modules...'",
  "go mod download",
  "go mod tidy",
  "echo 'All dependencies installed successfully!'",
]

[tasks.release-upload]
description = "Create GitHub release from binaries already sitting in ./bin (used by CI)"
run = [
  "gh release create v$VERSION ./bin/icloud-linux-amd64 ./bin/icloud-linux-arm64 ./bin/icloud-darwin-amd64 ./bin/icloud-darwin-arm64 ./bin/icloud-windows-amd64.exe",
]

[tasks.release]
description = "Build everything then publish to GitHub (local one-shot; requires macOS + gh auth)"
depends = ["cross-build"]
run = [
  "gh release create v$VERSION ./bin/icloud-linux-amd64 ./bin/icloud-linux-arm64 ./bin/icloud-darwin-amd64 ./bin/icloud-darwin-arm64 ./bin/icloud-windows-amd64.exe",
]

[tasks.push-tag]
description = "Push version tag to trigger automated GitHub Actions release"
run = [
  "echo 'Creating and pushing tag v$VERSION...'",
  "if git rev-parse \"v$VERSION\" >/dev/null 2>&1; then echo 'Tag v$VERSION already exists locally. Pushing to origin...'; else echo 'Creating new tag v$VERSION...'; git tag v$VERSION; fi",
  "git push origin v$VERSION",
  "echo 'Tag v$VERSION pushed successfully!'",
  "echo 'GitHub Actions will automatically create a release with binaries.'",
]

# Convenience aliases for common tasks
[tasks.run]
description = "Build and run the CLI"
depends = ["build"]
run = ["./bin/icloud"]
